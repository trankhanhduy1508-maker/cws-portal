name: Build Android Payment Listener

# PHẦN 5 — build APK MBBank Notification Listener qua CI, không phụ
# thuộc máy dev có Android SDK hay không. Chỉ chạy khi có thay đổi trong
# android-payment-listener/ (hoặc bấm chạy tay) — không ảnh hưởng CI
# backend/frontend hiện có (ci.yml, không đụng vào).
on:
  push:
    branches: [main]
    paths:
      - "android-payment-listener/**"
      - ".github/workflows/android-payment-listener-build.yml"
  pull_request:
    paths:
      - "android-payment-listener/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-payment-listener
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cài Android SDK command-line tools + platform-tools + build-tools
      # + platform ĐÚNG compileSdk khai báo trong app/build.gradle.kts
      # (34) — action này tự accept license, không cần bước riêng.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-payment-listener/**/*.gradle*', 'android-payment-listener/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cấp quyền chạy gradlew
        run: chmod +x gradlew

      # KHÔNG dùng secret thật trong CI (PHẦN 6) — build debug CHỈ cần
      # biên dịch được, KHÔNG cần backend/secret thật. cws.payment.enabled
      # để trống -> mặc định "false" (CAPTURE_ONLY) trong build.gradle.kts.
      - name: Tạo local.properties (placeholder, KHÔNG phải secret thật)
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=${{ env.ANDROID_HOME }}
          cws.backend.base.url=https://build-only-placeholder.invalid
          cws.device.secret=build-only-placeholder-not-a-real-secret
          cws.payment.enabled=false
          EOF

      - name: Unit test (testDebugUnitTest)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (lintDebug)
        run: ./gradlew lintDebug --stacktrace

      - name: Build APK debug (assembleDebug) — CAPTURE_ONLY mặc định
        run: ./gradlew assembleDebug --stacktrace

      - name: Kiểm tra APK đã tạo và không rỗng
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || (echo "APK không tồn tại hoặc rỗng: $APK" && exit 1)
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cws-mbbank-listener-debug-apk
          path: android-payment-listener/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cws-mbbank-listener-test-report
          path: |
            android-payment-listener/app/build/reports/tests/testDebugUnitTest/
            android-payment-listener/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
